name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Callable so the release workflow can gate on this exact set of jobs rather than
  # maintaining a partial copy that drifts out of sync.
  workflow_call:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tauri-plugin-secure-element
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tauri-plugin-secure-element/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --check

      - name: Run clippy
        run: cargo clippy -- -D warnings

      - name: Check compilation
        run: cargo check

      - name: Run tests
        run: cargo test

      # The only thing that exercises build.rs's packaging branch and proves the crate
      # that would be published actually builds. Left unchecked, a break here surfaces
      # at `cargo publish`, after the release tag has already been cut.
      #
      # --allow-dirty because the earlier steps in this job run build.rs, which writes
      # generated permission files back into the source tree. What is being verified is
      # that the crate packages and builds, not that the checkout is pristine.
      - name: Verify the crate packages
        run: cargo package --allow-dirty

  typescript:
    name: TypeScript Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tauri-plugin-secure-element
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Check formatting
        run: pnpm exec prettier --check .

      - name: Build TypeScript
        run: pnpm build

      # Catches the beta.5 failure mode: the build succeeds but emits declarations
      # to a path package.json does not point at, so the published package has no
      # resolvable types. Only a tarball listing reveals it.
      - name: Verify package entry points
        run: pnpm verify:package

  swift:
    name: Swift Lint & Tests
    runs-on: macos-latest
    defaults:
      run:
        working-directory: tauri-plugin-secure-element
    steps:
      - uses: actions/checkout@v7

      - name: Install SwiftLint
        run: brew install swiftlint swiftformat

      # Both paths, not just ios/. ios/Sources/SecureEnclaveCore.swift is a symlink into
      # swift/, and swiftformat skips symlinks — so the largest and most
      # security-critical Swift file was reported as "skipped" and never checked, along
      # with the macOS-only swift/secure_element_ffi.swift.
      - name: Check Swift formatting
        run: swiftformat --lint ios/ swift/

      # No path argument: .swiftlint.yml lists what to lint, including swift/, and
      # excludes the symlink so nothing is linted twice.
      - name: Run SwiftLint
        run: swiftlint lint

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # ios/Package.swift depends on "Tauri" at ../.tauri/tauri-api, a copy of the
      # tauri crate's own mobile/ios-api Swift package that the Tauri CLI normally
      # drops there while building an app for iOS. It is gitignored, so a fresh
      # checkout cannot resolve the package at all without this.
      - name: Materialise the Tauri iOS API package
        run: ./scripts/materialize-tauri-ios.sh

      # ios/Tests/PluginTests covers the pure key-namespacing helpers in
      # SecureEnclaveCore (applicationTag/decodeKeyName) — no Secure Enclave needed,
      # so the iOS Simulator (no real hardware) is sufficient. Package.swift declares
      # UIKit-dependent sources, which `swift test` cannot build against the macOS
      # host SDK, so this goes through xcodebuild against a simulator destination
      # instead of `swift test`. The device name is picked at run time rather than
      # hardcoded, since the exact simulator lineup available depends on the Xcode
      # version macos-latest ships and changes over time.
      - name: Run Swift tests
        run: |
          device=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          runtimes = json.load(sys.stdin)['devices']
          names = [d['name'] for devices in runtimes.values() for d in devices if d['name'].startswith('iPhone')]
          print(names[0])
          ")
          echo "Testing against: $device"
          xcodebuild test \
            -scheme tauri-plugin-secure-element \
            -destination "platform=iOS Simulator,name=$device"
        working-directory: tauri-plugin-secure-element/ios

  kotlin:
    name: Kotlin Lint & Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tauri-plugin-secure-element
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      # Before ktlint, not just before Gradle: @naturalcycles/ktlint ships a shell
      # wrapper that execs `java`, so the lint step needs a JDK too. Relying on
      # whatever the runner image preinstalls means the ktlint step silently runs on a
      # different Java than the Gradle step.
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # Runs the ktlint bundled with @naturalcycles/ktlint, which is pinned to the exact
      # version android/build.gradle.kts hands the ktlint Gradle plugin. Keep them equal
      # or the CLI and Gradle disagree about the same files.
      - name: Run ktlint
        run: pnpm lint:kotlin

      # Needed only for `cargo metadata` in the next step — nothing here compiles Rust,
      # so this job does not need the Tauri Linux dependencies.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # android/settings.gradle includes :tauri-android from android/.tauri/tauri-api,
      # which is gitignored and normally only appears when the Tauri CLI builds an app
      # for Android. Without it Gradle resolves an empty project and fails with
      # "No matching variant of project :tauri-android ... No variants exist".
      - name: Materialise the Tauri Android project
        run: ./scripts/materialize-tauri-android.sh

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      # The unit tests in android/src/test have existed since before this job did and
      # had never run anywhere but a developer's machine.
      - name: Run Kotlin unit tests
        run: ./gradlew test --no-daemon
        working-directory: tauri-plugin-secure-element/android

  rust-windows:
    name: Rust Checks (Windows)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: tauri-plugin-secure-element
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tauri-plugin-secure-element/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Run clippy
        run: cargo clippy -- -D warnings

      - name: Check compilation
        run: cargo check

      # Also a link check: src/windows.rs has a test that takes the address of every
      # function calling into NCrypt, so the linker has to resolve those imports.
      # `cargo check` never links, and nothing else in a test binary references them.
      - name: Run tests
        run: cargo test

  rust-macos:
    name: Rust Checks (macOS)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: tauri-plugin-secure-element
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tauri-plugin-secure-element/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Run clippy
        run: cargo clippy -- -D warnings

      - name: Check compilation
        run: cargo check

      # Also a link check: src/desktop.rs has a test that takes the address of every
      # Swift `@_cdecl` entry point, so a name mismatch between the Rust `extern "C"`
      # declarations and swift/secure_element_ffi.swift fails here rather than in a
      # consuming application. `cargo check` runs build.rs — which does catch a Swift
      # compile error — but never links.
      - name: Run tests
        run: cargo test
