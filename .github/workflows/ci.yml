name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Callable so the release workflow can gate on this exact set of jobs rather than
  # maintaining a partial copy that drifts out of sync.
  workflow_call:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tauri-plugin-secure-element
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tauri-plugin-secure-element/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --check

      - name: Run clippy
        run: cargo clippy -- -D warnings

      - name: Check compilation
        run: cargo check

      - name: Run tests
        run: cargo test

  typescript:
    name: TypeScript Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tauri-plugin-secure-element
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Check formatting
        run: pnpm exec prettier --check .

      - name: Build TypeScript
        run: pnpm build

      # Catches the beta.5 failure mode: the build succeeds but emits declarations
      # to a path package.json does not point at, so the published package has no
      # resolvable types. Only a tarball listing reveals it.
      - name: Verify package entry points
        run: pnpm verify:package

  swift:
    name: Swift Lint
    runs-on: macos-latest
    defaults:
      run:
        working-directory: tauri-plugin-secure-element
    steps:
      - uses: actions/checkout@v7

      - name: Install SwiftLint
        run: brew install swiftlint swiftformat

      - name: Check Swift formatting
        run: swiftformat --lint ios/

      - name: Run SwiftLint
        run: swiftlint lint ios/

  kotlin:
    name: Kotlin Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tauri-plugin-secure-element
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Run ktlint
        run: pnpm lint:kotlin

  rust-windows:
    name: Rust Checks (Windows)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: tauri-plugin-secure-element
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tauri-plugin-secure-element/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Run clippy
        run: cargo clippy -- -D warnings

      - name: Check compilation
        run: cargo check

      - name: Run tests
        run: cargo test

  rust-macos:
    name: Rust Checks (macOS)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: tauri-plugin-secure-element
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tauri-plugin-secure-element/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Run clippy
        run: cargo clippy -- -D warnings

      - name: Check compilation
        run: cargo check

      - name: Run tests
        run: cargo test
